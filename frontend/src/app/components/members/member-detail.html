<div class="member-detail-page">
  <h2 class="page-title">Member details</h2>

  <div *ngIf="!loading(); else loadingTpl">
    <div class="error-text" *ngIf="error()">{{ error() }}</div>

    <div class="detail-card" *ngIf="member() as m">
      <div class="detail-row" *ngFor="let k of keys(m)">
        <div class="detail-key">{{ k }}</div>
        <div class="detail-value">{{ m[k] }}</div>
      </div>
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-state">Loading...</div>
  </ng-template>
</div>
