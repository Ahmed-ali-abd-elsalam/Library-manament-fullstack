<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Reset your password</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" class="input" type="email" [(ngModel)]="email" required />
      </div>

      <div class="form-field">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" class="input" type="password" [(ngModel)]="newPassword" required />
      </div>

      <div class="form-field">
        <label for="confirmNewPassword">Confirm new password</label>
        <input id="confirmNewPassword" name="confirmNewPassword" class="input" type="password" [(ngModel)]="confirmNewPassword" required />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="!canSubmit">{{ loading ? 'Updating...' : 'Update password' }}</button>
        <a class="btn btn-outline" routerLink="/login">Back to login</a>
      </div>

      @if(error()!=''){
        <p class="error">{{ error() }}</p>
      }
      @if(info()!=''){
        <p class="info">{{ info() }}</p>
      }
    </form>
  </div>
</div>
