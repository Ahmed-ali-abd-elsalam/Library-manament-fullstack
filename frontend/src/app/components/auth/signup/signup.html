<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Create your account</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="name">Full name</label>
        <input id="name" name="name" class="input" type="text" [(ngModel)]="name" required />
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" class="input" type="email" [(ngModel)]="email" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" class="input" type="password" [(ngModel)]="password" required />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Signing up...' : 'Sign up' }}</button>
        <a class="btn btn-outline" routerLink="/">Home</a>
      </div>

      <div class="auth-links">
        <a routerLink="/login">Already have an account? Sign in</a>
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
