@if (!success()) {

<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Create your account</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="name">Full name</label>
        <input id="name" name="name" class="input" type="text" [(ngModel)]="name" required />
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" class="input" type="email" [(ngModel)]="email" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          class="input"
          type="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="loading">
          {{ loading ? 'Signing up...' : 'Sign up' }}
        </button>
        <a class="btn btn-outline" routerLink="/">Home</a>
      </div>

      <div class="auth-links">
        <a routerLink="/login">Already have an account? Sign in</a>
      </div>
      @if(error() !=''){
      <p>{{ error() }}</p>
      }
    </form>
  </div>
</div>
} @else {
<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Registration successful</h2>
    <p class="info-text">Please check your email to confirm your registration.</p>
    <div class="form-actions">
      <a class="btn btn-primary" routerLink="/login">Go to login</a>
      <a class="btn btn-outline" routerLink="/">Home</a>
    </div>
  </div>
</div>
}
