<div class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Forgot your password?</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" class="input" type="email" [(ngModel)]="email" required />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send reset link' }}</button>
        <a class="btn btn-outline" routerLink="/login">Back to login</a>
      </div>

      @if(error()!=''){
        <p class="error">{{ error() }}</p>
      }
    </form>
  </div>
</div>
